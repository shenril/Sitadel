## Risk level allowed for the scan
## Most attacks plugin are registered as noisy
## Values are:
##             - 0 : NO DANGER
##             - 1 : NOISY
##             - 2 : DANGEROUS
risk: 1

## DNS Server used to perform CDN verification
## Default is Google DNS
dns_resolver: 8.8.8.8

## Root location for the datafile used by the plugins
datastore: sitadel/data

## Crawler tuning
## URLs are de-duplicated by their parameter signature (scheme, host, path and the
## set of parameter names), so value permutations like ?id=1 / ?id=2 collapse to a
## single representative page instead of exploding the crawl.
crawler:
  max_depth: 3          # how many link hops from the start URL to follow
  max_pages: 500        # hard cap on discovered pages
  concurrency: 20       # simultaneous in-flight requests
  timeout: 15           # per-request timeout in seconds
  ignore_params: []     # parameter names dropped before signing (e.g. utm_source)

## List of fingerprint plugins activated
fingerprint_plugins:
  - cms
  - system
  - framework
  - frontend
  - header
  - lang
  - server
  - waf
  - tech      # signature-based technology detection (feeds the target profile)
  - favicon   # favicon (mmh3) hash

## List of attacks plugins activated
attack_plugins:
  - bruteforce # Parrallelized
  - injection # Parrallelized
  - vulns
  - other
  - authz # Access control: IDOR / broken access control (risk 2 only)
  - auth # JWT / token security: alg=none, RS256->HS256, kid, weak secret (risk 2 only)
